<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование тренера</title>
    <style>
        body {
            background: #0a0a0a;
            color: #e5e7eb;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }

        .card {
            background: #141414;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 600px;
            margin: auto;
        }

        h2 {
            color: #dc2626;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #9ca3af;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0f0f0f;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 5px rgba(220, 38, 38, 0.4);
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #dc2626;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover {
            background: #b91c1c;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>✏️ Редактировать тренера</h2>
    <form method="post">
        {% csrf_token %}

        <label>ФИО:</label>
        <input type="text" name="name" value="{{ trainer.name }}" required>

        <label>Специализация:</label>
        <input type="text" name="specialization" value="{{ trainer.specialization }}" required>

        <label style="margin-top: 20px;">Стоимость услуг:</label>
        <div class="price-grid">
            <div>
                <label>1 месяц:</label>
                <input type="number" step="0.01" name="price_1m" value="{{ trainer.price_1m }}" required>
            </div>
            <div>
                <label>3 месяца:</label>
                <input type="number" step="0.01" name="price_3m" value="{{ trainer.price_3m }}" required>
            </div>
            <div>
                <label>6 месяцев:</label>
                <input type="number" step="0.01" name="price_6m" value="{{ trainer.price_6m }}" required>
            </div>
            <div>
                <label>1 год:</label>
                <input type="number" step="0.01" name="price_1y" value="{{ trainer.price_1y }}" required>
            </div>
        </div>

        <button type="submit">Сохранить изменения</button>
    </form>

    <a href="{% url 'trainer_detail' trainer.pk %}">← Отмена</a>
</div>
</body>
</html>
